<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="MOC logo: a bird in flight carrying a letter, inside a chat bubble">
  <title>MOC. Mode of Communication</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a2740"/><stop offset="0.5" stop-color="#14507d"/><stop offset="1" stop-color="#2b8fd0"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="236" fill="url(#bg)"/>
  <path d="M580.6 798.8 A330 330 0 1 1 803.4 630.9 L777.0 854.4 Z" fill="none" stroke="#ffffff" stroke-width="38" stroke-linejoin="round" stroke-linecap="round"/>
