<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MOC new bird</title>
<style>
  body { margin: 0; font-family: "Segoe UI", Arial, sans-serif; color: #1d2733; background: #f3f7fb; }
  header { padding: 28px 32px 8px; } h1 { margin: 0 0 4px; font-size: 1.6rem; }
  header p { margin: 0; color: #5b6875; max-width: 62em; }
  .card { margin: 20px 32px 40px; max-width: 640px; background: #fff; border: 1px solid #dfe7ee; border-radius: 20px; padding: 20px; }
  .stage { display: flex; align-items: center; justify-content: center; border-radius: 14px; padding: 18px; margin-bottom: 12px; }
  .light { background: #fff; border: 1px solid #dfe7ee; } .home { background: linear-gradient(160deg, #cfd8e3, #aebccc); } .dark { background: #0b2c47; }
  .stage img.big { width: 340px; height: 340px; }
  .row { display: flex; align-items: flex-end; justify-content: center; gap: 22px; }
  .row figure { margin: 0; text-align: center; font-size: 0.75rem; color: #4b5a6b; } .dark .row figure { color: #9fb4c8; }
  .row img { display: block; margin: 0 auto 4px; }
</style></head>
<body>
<header><h1>The new MOC bird</h1>
<p>Newly designed: a bird in flight with two swept leaf wings, carrying a letter (an envelope) in its beak, in one thick white line. It has no fill of its own, so it takes the background colour inside and outside the chat bubble.</p></header>
<section class="card">
  <div class="stage light"><img class="big" src="nb-final.png" alt="New MOC bird icon" /></div>
  <div class="stage home"><div class="row"><figure><img src="nb-final.png" width="120" height="120" alt="" />120px</figure><figure><img src="nb-final.png" width="72" height="72" alt="" />72px</figure><figure><img src="nb-final.png" width="48" height="48" alt="" />48px</figure><figure><img src="nb-final.png" width="32" height="32" alt="" />32px</figure><figure><img src="nb-final.png" width="16" height="16" alt="" />16px</figure></div></div>
  <div class="stage dark"><div class="row"><figure><img src="nb-final.png" width="72" height="72" alt="" />on dark</figure><figure><img src="nb-final.png" width="32" height="32" alt="" />32px</figure></div></div>
</section>
</body></html>
